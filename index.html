<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JaceAt1HP • 1HP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body { font-family: 'Inter', system-ui, sans-serif; }
        
        .glass {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(24px);
        }
        
        .nav-link { position: relative; }
        .nav-link:after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -2px;
            left: 0;
            background: linear-gradient(to right, #3b82f6, #60a5fa);
            transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .nav-link:hover:after { width: 100%; }

        .hero-bg {
            background: radial-gradient(at center top, rgba(59, 130, 246, 0.25), transparent 70%);
        }

        .medal-1 { background: linear-gradient(135deg, #ffd700, #ffaa00); color: black; animation: winnerPop 2s ease-in-out; }
        .medal-2 { background: linear-gradient(135deg, #c0c0c0, #a8a8a8); color: black; animation: winnerPop 2s ease-in-out 0.3s; }
        .medal-3 { background: linear-gradient(135deg, #cd7f32, #b36b2a); color: black; animation: winnerPop 2s ease-in-out 0.6s; }

        @keyframes winnerPop {
            0% { transform: scale(0.8); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body class="bg-zinc-950 text-white overflow-x-hidden">

    <footer class="bg-black py-12 text-center text-zinc-500 text-sm">

    </footer>

    <script>
        // Mobile Menu (same)
        document.getElementById('mobile-menu-button').addEventListener('click', () => {
            document.getElementById('mobile-menu').classList.toggle('hidden');
        });

        // Twitch Live (same)
        async function checkTwitchStatus() { /* ... same as before */ }

        // Bi-Weekly Countdown (Every Monday 12:00 PM EST)
        function startCountdown() {
            const countdownEl = document.getElementById('countdown');

            function updateCountdown() {
                const now = new Date();
                const nextMonday = new Date(now);
                nextMonday.setDate(now.getDate() + ((8 - now.getDay()) % 7 || 7));
                nextMonday.setHours(12, 0, 0, 0); // 12:00 PM

                // If today is Monday after 12 PM, go to next Monday
                if (now.getDay() === 1 && now.getHours() >= 12) {
                    nextMonday.setDate(nextMonday.getDate() + 7);
                }

                const diff = nextMonday - now;

                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));

                countdownEl.textContent = `Next payout in: ${days}d ${hours}h ${minutes}m`;
            }

            updateCountdown();
            setInterval(updateCountdown, 60000);
        }

        // Leaderboard with animation
        async function fetchLeaderboard() {
            // ... (same fetch logic as before)
            // When rendering top 3, the CSS animation .medal-1 etc. will trigger
        }

        // Initialize
        window.onload = () => {
            checkTwitchStatus();
            setInterval(checkTwitchStatus, 60000);
            fetchLeaderboard();
            setInterval(fetchLeaderboard, 900000);
            startCountdown();
        };
    </script>
